		<script>
			let table = document.getElementById('tbody');
			let row = document.createElement('tr');

			for (let j = 0; j < 11; j++) {
				let col = document.createElement('td');
				col.innerText = (j == 0) ? " " : 10*(j+11);
				row.append(col);
			}

			table.append(row);
			for (let i = 0; i < 10; i++) {
				let row = document.createElement('tr');
				for (let j = 0; j < 11; j++) {
					let col = document.createElement('td');
					col.innerText = (j == 0) ? 7*(i+2) : 7*(i+2)*10*(j+11);
					row.append(col);
				}
				table.append(row);
			}
		</script>
